<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composer mon séjour · AFA Tours</title>
<style>
:root{--brown:#2A0C07;--red:#B51D27;--or:#E8832F;--cream:#FBF6EF;--ink:#2F1A14;--mute:#7a6258;--line:#e6d8cc;--d:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;background:#ddd3c8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px 12px}
.app{width:min(480px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(20,5,2,.35);display:flex;flex-direction:column}
.hd{background:linear-gradient(120deg,var(--brown),#5b1a10);color:#fff;padding:20px 22px;position:sticky;top:0;z-index:5}
.hd h1{font:600 1.45rem var(--d);margin:0}.hd p{margin:2px 0 0;opacity:.8;font-size:.9rem}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.2rem;cursor:pointer}
.bd{padding:18px 20px;flex:1}
.lbl{font-weight:700;font-size:.9rem;margin:12px 0 6px;display:block}
.sub{font:600 1.02rem var(--d);color:var(--red);margin:14px 0 6px}
input,select{width:100%;padding:.65em .85em;border:1.5px solid #d9c9b8;border-radius:12px;font:inherit;background:#fff;color:var(--ink);margin-top:0}
input:focus,select:focus{outline:3px solid rgba(232,131,47,.35);border-color:var(--or)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;flex:none;margin:0;accent-color:#B51D27;padding:0}
.fmt{display:block;font-size:.84rem;color:var(--mute);font-weight:600;margin-top:4px}
.fmt a{color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;margin-top:8px}
.opt.on{border-color:var(--red);background:#fff7f4}
.opt .t{flex:1;min-width:0;display:grid;gap:2px}.opt .t b{font-size:.93rem}.opt .t small{color:var(--mute);font-size:.8rem}
.day{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.day>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;background:#fff}
.day>summary::-webkit-details-marker{display:none}
.day>summary b{font:600 1.05rem var(--d)}.day>summary small{color:var(--mute);font-weight:600}
.day .in{padding:0 15px 15px}
.card{background:var(--cream);border-radius:14px;padding:12px 14px;margin-top:10px}
.card.draft{border:2px solid var(--or);background:#fffaf5}
.card h4{margin:0 0 8px;font:600 .98rem var(--d)}
.tl{list-style:none;padding:0;margin:6px 0}
.tl li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.btn{border-radius:999px;padding:.75em 1.3em;font:inherit;font-weight:700;cursor:pointer;border:1.5px solid transparent;display:inline-block;text-align:center;background:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.red{background:var(--red);color:#fff}.out{background:#fff;color:var(--ink);border-color:var(--brown)}.sm{padding:.45em .9em;font-size:.86rem}
.rm{background:none;border:0;color:var(--red);font-weight:700;cursor:pointer;padding:4px 0;white-space:nowrap}
.sum{background:var(--cream);border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sum .amt{font:700 1.1rem var(--d);color:var(--red)}
.nv{display:flex;justify-content:space-between;gap:10px;padding:14px 20px 20px}
.box{background:var(--cream);border-radius:14px;padding:13px 15px;margin:10px 0}
.box h3{font:600 1.02rem var(--d);color:var(--red);margin:0 0 6px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.92rem}
.pay{display:grid;gap:8px;margin:8px 0}.pay label{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer}.pay label:has(input:checked){border-color:var(--red);background:#fff7f4}.pay small{display:block;color:var(--mute)}
.ok{text-align:center;padding:30px 20px}.ck{width:74px;height:74px;border-radius:50%;background:#e6f6ea;color:#1b8a3b;display:grid;place-items:center;margin:0 auto 14px;font-size:2.2rem}
.ref{font:800 1.4rem ui-monospace,Menlo,monospace;letter-spacing:.06em;background:var(--cream);border-radius:12px;padding:.5em 1em;display:inline-block;margin:8px 0}
.note{font-size:.88rem;color:var(--mute);margin:6px 0 0}
.err{color:#b51d27;font-weight:700;font-size:.88rem;min-height:1.2em;margin-top:8px}
.alert{border-radius:12px;padding:8px 11px;font-size:.88rem;margin:6px 0}
.alert.err2{background:#fdecec;color:#8a1520;font-weight:600}.alert.warn{background:#fff4e6;color:#7a4300}.alert.info{background:#eef4fb;color:#24476b}
.blocking{border:2px solid #B51D27;border-radius:14px;padding:10px 12px;margin:10px 0;background:#fff}
.blocking h3{margin:0 0 6px;color:#B51D27;font:700 1rem var(--d)}
.stat{font-weight:700;font-size:.9rem;margin:10px 0 0}
.cat{font-size:.84rem;color:var(--mute);background:var(--cream);border-radius:12px;padding:9px 11px;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ==========================================================
   DONNÉES
   Circuits et partenaires : lus dans la base du site (publiés uniquement).
   Zones, durées de trajet, prix des véhicules, taux de change : PROPOSITIONS à valider.
   ========================================================== */
/* Données reçues du site à l'ouverture (circuits, partenaires, transports). */
let ZONES=[],CIRC=[],HOT=[],RES=[],VEH=[],READY=false;
const ROOMS=['Chambre simple','Chambre double','Chambre twin (2 lits séparés)','Suite'];
const DIET=['Végétarien','Halal','Sans porc','Sans gluten','Allergie arachides','Allergie fruits de mer'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DEFAULT_CIRC_H=4;
const ZID={'axe-du-pouvoir':'Porto-Novo','secrets-riviere-noire':'Porto-Novo','vie-ciel-eau':'Cotonou','route-memoires':'Ouidah','traces-danxome':'Abomey','amazone-atlantique':'Cotonou','fleuve-ocean':'Grand-Popo','aguegues':'Porto-Novo','dangbo':'Porto-Novo','vodun-gardiens':'Porto-Novo','egungun':'Porto-Novo','guelede':'Porto-Novo','ketou':'Plateau','pobe':'Plateau','sakete':'Plateau'};
/* Taux indicatifs : 1 € = 655,957 FCFA (taux fixe) ; 1 $ = 580 FCFA (à mettre à jour) */
const EUR_XOF=655.957, USD_XOF=580;
let CURSEL='XOF';
/* Repas : heure proposée, durée, et s'il ne peut y en avoir qu'un par jour */
const SLOTS={'Petit-déjeuner':{t:'07:30',h:0.5,once:true},'Déjeuner':{t:'12:30',h:1.5,once:true},'Dîner':{t:'19:30',h:1.5,once:true},'Repas':{t:'12:00',h:1,once:false}};

/* ==========================================================
   ÉTAT
   ========================================================== */
const S={step:1,startZone:'Porto-Novo',start:'',days:3,adults:2,kids:0,diet:[],dietNote:'',open:0,
 nm:'',nat:'',w:'',e:'',pay:'momo',done:false,closed:false,ref:'AFA-DEMO',D:[],panel:null};
/* Une journée : des étapes (circuits, autres destinations, repas) et UNE nuit */
const newDay=()=>({t0:'08:00',stops:[],veh:[],
 night:{mode:'none',hotel:'',zone:'',own:{name:'',addr:''},roomType:0,rooms:1,beds:1,twin:false,bf:false}});
function ensure(){while(S.D.length<S.days)S.D.push(newDay())}
/* Circuits enregistrés sur le site (« Réserver ce circuit ») : placés un par jour, sans doublon */
function addSaved(ids){
 S.seenSaved=S.seenSaved||[];
 const have=new Set(S.D.flatMap(d=>d.stops.filter(s=>s.kind==='circ').map(s=>s.ref)));
 ids.forEach(id=>{
  if(S.seenSaved.includes(id)||have.has(id))return;
  S.seenSaved.push(id);
  let day=S.D.find(d=>!d.stops.length);
  if(!day){day=newDay();S.D.push(day)}
  day.stops.push({kind:'circ',ref:id});
 });
 S.days=Math.max(S.days,S.D.length);
 ensure();
}

/* ==========================================================
   UTILITAIRES
   ========================================================== */
const app=()=>document.getElementById('app');
const pax=()=>S.adults+S.kids;
const money=n=>Math.round(n).toLocaleString('fr-FR')+' FCFA';
const money3=n=>{const cs=[CURSEL].concat(['XOF','USD','EUR'].filter(c=>c!==CURSEL));const f={XOF:()=>money(n),USD:()=>'≈ '+Math.round(n/USD_XOF).toLocaleString('fr-FR')+' $',EUR:()=>'≈ '+Math.round(n/EUR_XOF).toLocaleString('fr-FR')+' €'};return cs.map(c=>f[c]()).join(' · ')};
const toH=s=>{const p=String(s||'08:00').split(':');return (+p[0])+(+p[1]||0)/60};
/* Heure affichée sur 24 h, de 00:00 à 23:59. Au-delà de minuit : « (lendemain) ». */
const clock=t=>{const m=Math.round(t*60),H=Math.floor(m/60)%24,M=m%60;return ('0'+H).slice(-2)+':'+('0'+M).slice(-2)+(t>=24?' (lendemain)':'')};
/* Durée : 1h, 1h 30, 6h 30, 45 min */
const fmtH=h=>{const H=Math.floor(h),m=Math.round((h-H)*60);if(!H)return m+' min';return H+'h'+(m?' '+('0'+m).slice(-2):'')};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fdt=v=>{if(!v)return'';const p=v.split('-');return (+p[2])+' '+MOIS[+p[1]-1]+' '+p[0]};
const dateOf=i=>{if(!S.start)return'Jour '+(i+1);const t=new Date(S.start+'T12:00:00');t.setDate(t.getDate()+i);return t.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})};
const cOf=id=>CIRC.find(c=>c.id===id), hOf=id=>HOT.find(h=>h.id===id), rOf=id=>RES.find(r=>r.id===id);
const partnersIn=(list,z)=>list.filter(x=>x.z===z);
const stopZone=s=>s.kind==='circ'?cOf(s.ref).z:s.zone;
const planH=c=>c.h===null?DEFAULT_CIRC_H:c.h;
const mealTime=s=>toH(s.time||SLOTS[s.slot].t);
const SEARCH=(z,what)=>'https://www.google.com/search?q='+encodeURIComponent(what+' '+z+' Bénin');
const head=(t,s)=>'<div class="hd"><h1>'+t+'</h1><p>'+s+'</p><button class="x" data-a="close" aria-label="Fermer">×</button></div>';
const nav=(back,next,label)=>'<p class="err" id="err"></p><div class="nv">'+(back?'<button class="btn out" data-a="go" data-to="'+back+'">Retour</button>':'<span></span>')+'<button class="btn red" data-a="go" data-to="'+next+'">'+label+'</button></div>';
const opts=(list,val,ph)=>(ph?'<option value="">'+ph+'</option>':'')+list.map(x=>'<option value="'+x.v+'"'+(val===x.v?' selected':'')+(x.d?' disabled':'')+'>'+x.t+'</option>').join('');
const zsel=(attrs,val,ph)=>'<select '+attrs+'><option value="">'+(ph||'Choisir une ville')+'</option>'+ZONES.map(z=>'<option value="'+z+'"'+(val===z?' selected':'')+'>'+z+'</option>').join('')+'</select>';
const priceTxt=c=>!c.p?'Tarif sur demande':money3(c.p)+(c.unit==='groupe'?' / groupe':' / pers.')+(c.from?' (à partir de)':'');
const noPartnerTxt=(z,what)=>'<span class="fmt">Pas de partenaire AFA ('+what+') à '+z+'. <a href="'+SEARCH(z,what)+'" target="_blank" rel="noopener">Chercher en ligne</a>. Vous pouvez aussi l’écrire ci-dessous.</span>';
const DUR_OPTS=[1,1.5,2,2.5,3,4,5,6,7,8].map(h=>({v:String(h),t:fmtH(h)}));

/* ==========================================================
   MOTEUR : trajet de chaque journée
   - Le départ d'une journée = le lieu où l'on a dormi la veille.
   - Les repas ont une heure fixe. Ils sont placés dans l'ordre des heures.
   - Chaque trajet est calculé entre deux lieux consécutifs.
   - Une heure ne dépasse jamais 23 h 59 : une journée qui va au-delà de minuit est bloquante.
   ========================================================== */
function lastZone(i){const d=S.D[i];return d.stops.length?stopZone(d.stops[d.stops.length-1]):startOf(i)}
function startOf(i){return i===0?S.startZone:endOf(i-1)}
function endOf(i){const d=S.D[i];if(d.night.mode!=='none')return d.night.zone||lastZone(i);return lastZone(i)}
/* Lieu d'une étape : ville + nom du lieu (pour le calcul du trajet) */
function stopLoc(s){
 if(s.kind==='circ'){const c=cOf(s.ref);return{zone:c.z,place:c.dest}}
 if(s.kind==='custom')return{zone:s.zone,place:s.name||s.zone};
 const r=s.mode==='partner'?rOf(s.ref):null;
 if(r)return{zone:r.z,place:r.n};
 if(s.mode==='own'&&s.own.name)return{zone:s.zone,place:s.own.name};
 return{zone:s.zone,place:s.zone};
}
function nightLoc(n,fallback){
 const h=n.mode==='partner'?hOf(n.hotel):null;
 if(h)return{zone:h.z,place:h.n};
 const z=n.zone||fallback.zone;
 if(n.mode==='own'&&n.own.name)return{zone:z,place:n.own.name};
 return{zone:z,place:z};
}
/* Temps de trajet entre deux lieux. Démonstration : à remplacer par Google Maps. */
/* Durée de trajet : à confirmer par l’équipe tant que le calcul Google Maps n’est pas branché. null = inconnue. */
function travelH(a,b){return a.place===b.place?0:null}
function route(i){
 const d=S.D[i],warn=[],seq=[];
 const flow=[],meals=[];
 d.stops.forEach((s,idx)=>{if(s.kind==='meal')meals.push({s,idx,m:mealTime(s)});else flow.push({s,idx})});
 meals.sort((a,b)=>a.m-b.m);
 const t0=toH(d.t0);
 let loc={zone:startOf(i),place:startOf(i)},cur=t0,act=0,tr=0,mi=0,fi=0;
 /* trajet vers un lieu. Si l'heure du lieu est fixe, le trajet part au plus tard pour y arriver à l'heure */
 const moveTo=(to,fixedAt)=>{
  const h=travelH(loc,to);
  if(h===null){seq.push({k:'tr',from:loc,to,h:null,t:cur,price:0});tr++}
  else if(h>0){const st=fixedAt===undefined?cur:Math.max(cur,fixedAt-h);seq.push({k:'tr',from:loc,to,h,t:st,price:0});tr++;cur=st+h}
  loc=to;
 };
 const placeMeal=(x,pre)=>{
  const m=x.m,z=stopLoc(x.s),dh=SLOTS[x.s.slot].h;
  const lbl=x.s.slot==='Repas'?(x.s.name||'Repas libre'):x.s.slot;
  if(pre){/* avant le départ : pas de trajet */}
  else if(m<cur){warn.push(lbl+' prévu à '+clock(m)+' tombe pendant une visite ou un trajet (jusqu’à '+clock(cur)+'). Décalez-le.');loc=z}
  else{moveTo(z,m);if(cur>m+1e-6)warn.push('Arrivée à '+z.place+' vers '+clock(cur)+', après '+lbl+' prévu à '+clock(m)+'. Décalez-le.')}
  seq.push({k:'meal',idx:x.idx,s:x.s,zone:z.zone,place:z.place,t:m});
  cur=Math.max(cur,m+dh);act+=dh;
 };
 /* repas avant le départ (ex. petit-déjeuner à 7h 30 pour un départ à 8h) */
 while(mi<meals.length&&meals[mi].m<t0)placeMeal(meals[mi++],true);
 if(cur>t0+1e-6)warn.push('Le repas du matin finit à '+clock(cur)+', après l’heure de départ ('+clock(t0)+'). Avancez le départ.');
 seq.push({k:'start',zone:loc.zone,place:loc.place,t:t0});
 cur=Math.max(cur,t0);
 while(fi<flow.length||mi<meals.length){
  if(mi<meals.length&&(fi>=flow.length||meals[mi].m<=cur)){placeMeal(meals[mi++],false);continue}
  const c=flow[fi++],s=c.s,z=stopLoc(s);
  moveTo(z);
  const c0=s.kind==='circ'?cOf(s.ref):null,h=c0?planH(c0):(s.h===null?DEFAULT_CIRC_H:s.h);
  seq.push({k:'circ',idx:c.idx,s,c0,zone:z.zone,place:z.place,t:cur,h});
  cur+=h;act+=h;
 }
 const n=d.night;
 if(n.mode!=='none'){const to=nightLoc(n,loc);moveTo(to);seq.push({k:'night',zone:to.zone,place:to.place,t:cur,n})}
 return{seq,end:cur,act,tr,endZone:loc.zone,warn};
}
function usedMap(){const m={};for(let j=0;j<S.days;j++)S.D[j].stops.forEach(s=>{if(s.kind==='circ'&&!(s.ref in m))m[s.ref]=j+1});return m}
function hasSlot(i,slot){return S.D[i].stops.some(s=>s.kind==='meal'&&s.slot===slot)}

/* ==========================================================
   CONTRÔLES
   err2 = bloquant (rouge), warn = à vérifier (orange), info = pour information (bleu)
   ========================================================== */
function checks(i){
 const d=S.D[i],r=route(i),out=[],n=d.night;
 d.stops.forEach(s=>{
  if(s.kind==='meal'){
   if(s.slot==='Repas'&&!s.name)out.push(['err2','Repas libre : indiquez le nom du repas.']);
   if(!s.zone)out.push(['err2',s.slot+' : choisissez la ville.']);
   if(s.mode==='partner'&&!s.ref)out.push(['err2',s.slot+' : choisissez le restaurant partenaire.']);
   if(s.mode==='own'&&!s.own.name)out.push(['err2',s.slot+' : indiquez le nom du restaurant choisi.']);
  }
  if(s.kind==='custom'){
   if(!s.name)out.push(['err2','Autre destination : décrivez la visite.']);
   if(!s.zone)out.push(['err2','Autre destination : choisissez la ville.']);
   if(s.h===null)out.push(['info','Durée de « '+(s.name||'autre destination')+' » à confirmer : '+fmtH(DEFAULT_CIRC_H)+' retenues dans le calcul.']);
  }
 });
 if(n.mode==='partner'&&!n.hotel)out.push(['err2','Nuit : choisissez l’hôtel.']);
 if(n.mode==='own'&&!n.own.name)out.push(['err2','Nuit : indiquez le nom de l’hébergement.']);
 if(n.mode==='own'&&!n.zone)out.push(['err2','Nuit : choisissez la ville.']);
 r.warn.forEach(m=>out.push(['warn',m]));
 r.seq.forEach(x=>{if(x.k==='circ'&&x.c0&&x.c0.h===null)out.push(['info','Durée de « '+x.c0.n+' » à confirmer : '+fmtH(DEFAULT_CIRC_H)+' retenues dans le calcul.'])});
 if(r.end>=24)out.push(['err2','La journée dépasse minuit (fin vers '+clock(r.end)+'). Avancez l’heure de départ ou retirez une étape.']);
 else if(r.end>21)out.push(['warn','La journée se termine vers '+clock(r.end)+'. Vérifiez les horaires.']);
 if(r.act>11)out.push(['warn','Plus de 11 h d’activité ce jour-là : envisagez de répartir.']);
 if(r.tr>=3)out.push(['info','Ce jour-là : '+r.tr+' trajets. Leurs durées sont confirmées par notre équipe.']);
 if(i>0&&S.D[i-1].night.mode!=='none'&&S.D[i-1].night.bf&&hasSlot(i,'Petit-déjeuner'))
  out.push(['info','Petit-déjeuner déjà inclus à l’hôtel la veille : supprimez-le si ce n’est pas nécessaire.']);
 if(n.mode==='none'&&i<S.days-1)out.push(['info','Pas de nuit ce jour-là : le départ du lendemain se fait de '+r.endZone+'.']);
 return out;
}
function issues(){const L=[];for(let i=0;i<S.days;i++)checks(i).forEach(c=>{L.push({d:i+1,lv:c[0],m:c[1]})});return L}
function issuesHtml(){
 const L=issues(),e=L.filter(x=>x.lv==='err2'),w=L.filter(x=>x.lv==='warn'),n=L.filter(x=>x.lv==='info');
 const line=x=>'<div class="alert '+x.lv+'"><b>Jour '+x.d+'</b> · '+x.m+'</div>';
 return (e.length?'<div class="blocking"><h3>'+e.length+' erreur(s) à corriger avant d’envoyer</h3>'+e.map(line).join('')+'</div>':'<p class="stat">Aucune erreur bloquante.</p>')+
  (w.length?'<p class="stat">À vérifier</p>'+w.map(line).join(''):'')+
  (n.length?'<p class="stat">Informations</p>'+n.map(line).join(''):'');
}
function errCount(){return issues().filter(x=>x.lv==='err2').length}

/* ==========================================================
   LIBELLÉS
   ========================================================== */
function mealName(s){if(s.mode==='afa')return'à proposer par AFA TOURS';if(s.mode==='own')return(s.own.name||'à préciser')+' (à confirmer)';const r=rOf(s.ref);return r?r.n:'restaurant à choisir'}
function nightName(n){const room=ROOMS[n.roomType]+', '+n.rooms+' chambre(s)';
 if(n.mode==='afa')return'hébergement à proposer par AFA TOURS ('+room+')';
 if(n.mode==='own')return(n.own.name||'hébergement à préciser')+' (à confirmer, '+room+')';
 const h=hOf(n.hotel);return(h?h.n:'hôtel à choisir')+' ('+room+')'}
function rowText(x){const T=clock(x.t)+' · ';
 if(x.k==='tr'&&x.h===null)return T+'Trajet '+x.from.place+' → '+x.to.place+' (durée confirmée par notre équipe)';
 if(x.k==='start')return T+'Départ de '+x.place;
 if(x.k==='tr')return T+'Trajet '+x.from.place+' → '+x.to.place+' (environ '+fmtH(x.h)+')';
 if(x.k==='circ'){

 }
 if(x.k==='meal')return T+(x.s.slot==='Repas'?x.s.name||'Repas libre':x.s.slot)+' à '+x.zone+' : '+mealName(x.s);

 const out=[];
 route(i).seq.forEach(x=>{
  out.push({text:rowText(x),idx:(x.k==='circ'||x.k==='meal')?x.idx:undefined});
  if(x.k==='start'&&i>0&&S.D[i-1].night.mode!=='none'&&S.D[i-1].night.bf)out.push({text:clock(x.t)+' · Petit-déjeuner à l’hôtel, inclus'});

function calc(){
 let tot=0,devis=0;
 for(let i=0;i<S.days;i++){
  const d=S.D[i];
  d.stops.forEach(s=>{
   if(s.kind==='circ'){const c=cOf(s.ref);tot+=c.unit==='groupe'?c.p:c.p*S.adults;return}
   if(s.kind==='custom'){devis++;return}
   const r=rOf(s.ref);
   if(s.mode==='partner'&&r&&r.p)tot+=r.p*pax();else devis++;
  });
  const n=d.night;
  if(n.mode!=='none'){const h=n.mode==='partner'?hOf(n.hotel):null;if(h&&h.p)tot+=h.p*(n.rooms||1);else devis++}
  route(i).seq.forEach(x=>{if(x.k==='tr')tot+=x.price});
  d.veh.forEach(v=>{const x=VEH.find(z=>z.id===v.v);if(x){if(x.p)tot+=x.p*(v.days||1);else devis++}});
 }
 return{tot,devis};
}

function panelOk(P){
 if(!P)return false;

 if(P.kind==='stop'){

  return P.desc.trim()!==''&&!!P.dh;
 }
 if(P.kind==='meal'){
  if(!P.zone||!P.time)return false;
  if(P.slot==='Repas'&&!P.name.trim())return false;
  if(P.mode==='partner')return !!P.ref;
  if(P.mode==='own')return P.oname.trim()!=='';

 }
 if(P.kind==='night'){
  if(P.mode==='none')return true;

 if(P.kind==='veh')return !!P.v;

}

 const hd='<div class="rc-grid"><span>Durée</span><span>'+S.days+' jour(s)</span><span>Arrivée</span><span>'+(S.start?fdt(S.start):'—')+'</span><span>Nombre de personnes</span><span>'+pax()+' personne(s)</span><span>Éléments à confirmer</span><span>'+devis+'</span></div>';
 return head('Composer mon séjour','Étape 3 sur 4 · Votre programme proposé')+'<div class="bd">'+
 '<style>.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;background:#faf6f1;border-radius:12px;padding:12px 14px;font-size:.92rem}.rc-grid span:nth-child(odd){color:#7a6a62}.rc-h{font:700 .78rem Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#B51D27;margin:18px 0 8px}.rc-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid #e6dcd3}.rc-row b{display:block}.rc-row small{display:block;color:#7a6a62;font-size:.82rem}.rc-pr{text-align:right;white-space:nowrap;font-size:.92rem}.rc-pr b{display:block;font-weight:600}.rc-pr small{display:block}.rc-tag{display:inline-block;font:600 .72rem Arial,sans-serif;border-radius:20px;padding:2px 8px;background:#f3e3d6;color:#7a3b1e;margin-top:3px}.rc-tag.ok{background:#e4efe2;color:#2e5a2a}.rc-tot{background:#2a1a14;color:#fff;border-radius:14px;padding:14px 16px;margin-top:16px}.rc-tot small{opacity:.8;display:block}.rc-tot .rc-line{display:flex;justify-content:space-between;font-size:.9rem;margin-top:6px}.rc-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.88rem}.rc-two ul{margin:4px 0 0;padding-left:16px}</style>'+
 top+'<h3 class="rc-h">Votre demande</h3>'+hd+body+
 '<div class="rc-tot"><small>Total estimé</small><div style="font-size:1.4rem">'+(T?T[0]:'Sur devis')+'</div>'+(T&&T.length>1?'<small>'+T.slice(1).join(' · ')+'</small>':'')+(devis?'<div class="rc-line"><span>Éléments à confirmer</span><span>'+devis+'</span></div>':'')+'</div>'+
 '<p class="fmt">Estimation hors options. Notre équipe confirme chaque prix avant votre départ.</p>'+
 '<h3 class="rc-h">Inclus et non inclus</h3><div class="rc-two"><div><b>Inclus</b><ul><li>Circuits, guide et trajets organisés par AFA TOURS</li></ul></div><div><b>Non inclus</b><ul><li>Vols, visas</li><li>Boissons et dépenses personnelles</li></ul></div></div>'+
 '</div>'+nav(2,4,'Continuer')}
function s4c(){const{tot,devis}=calc(),ne=errCount();return head('Composer mon séjour','Étape 4 sur 4 · Vos coordonnées')+'<div class="bd">'+'<div class="row"><div><label class="lbl">Nom complet *</label><input data-txt="nm" value="'+esc(S.nm)+'"></div><div><label class="lbl">Nationalité</label><input data-txt="nat" value="'+esc(S.nat)+'" placeholder="Bénin, France…"></div></div>'+'<div class="row"><div><label class="lbl">WhatsApp ou téléphone *</label><input data-txt="w" value="'+esc(S.w)+'" placeholder="+229…"></div><div><label class="lbl">E-mail *</label><input type="email" data-txt="e" value="'+esc(S.e)+'"></div></div>'+'<p class="lbl">Mode de paiement au choix</p><div class="pay">'+[['momo','Mobile Money','MTN, Moov ou Celtiis'],['card','Carte bancaire','Visa ou Mastercard'],['bank','Virement bancaire','Référence fournie après validation'],['agency','Payer à l’agence ou sur place','Espèces, à Porto-Novo']].map(p=>'<label><input type="radio" name="pay" data-f="pay" value="'+p[0]+'"'+(S.pay===p[0]?' checked':'')+'><span><b>'+p[1]+'</b><small>'+p[2]+'</small></span></label>').join('')+'</div></div>'+'<p class="err" id="err"></p><div class="nv"><button class="btn out" data-a="go" data-to="3">Retour</button><button class="btn red" data-a="send"'+(ne?' disabled':'')+'>Envoyer ma demande</button></div>'}
function done(){const ok=S.okSent!==false;return '<div class="ok"><div class="ck">'+(ok?'✓':'!')+'</div><h2 style="font:600 1.5rem Georgia,serif;margin:0">'+(ok?'Demande enregistrée':'Une dernière étape')+'</h2>'+(ok?'<p class="note">Votre référence</p><div class="ref">'+S.ref+'</div><p class="note">Notre équipe vous répond sous 24 / 72 h max.</p>':'<p class="note">La connexion à notre serveur a échoué. Envoyez votre demande sur WhatsApp : elle sera traitée tout de suite.</p>')+'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px"><button class="btn out" data-a="mybk">Voir mes réservations</button>'+(S.waUrl?'<a class="btn red" href="'+S.waUrl+'" target="_blank" rel="noopener">'+(ok?'Envoyer aussi sur WhatsApp':'Envoyer sur WhatsApp')+'</a>':'')+'</div><div style="margin-top:10px"><button class="btn out" data-a="close">Fermer</button></div></div>'}
function closed(){return '<div class="ok"><h2 style="font:600 1.4rem Georgia,serif;margin:0">Réservation fermée</h2><p class="note">La fenêtre de réservation est fermée. Sur le site, elle se ferme et la page reste en place.</p><div style="margin-top:14px"><button class="btn out" data-a="reopen">Rouvrir (démonstration)</button></div></div>'}
function render(){
 if(!READY){app().innerHTML=head('Composer mon séjour','Chargement des circuits et des partenaires…')+'<div class="bd"><p class="note">Un instant.</p></div>';return}
 if(S.closed){app().innerHTML=closed();return}
 if(S.done){app().innerHTML=done();return}
 ensure();app().innerHTML=[s1,s2,s3p,s4c][S.step-1]()}
/* Fermer : ferme la fenêtre de réservation (évènement pour le site, message à la page parente) */
function closeBooking(){S.panel=null;try{parent.postMessage({type:'afa-close'},'*')}catch(e){}}

/* ==========================================================
   ÉVÉNEMENTS
   ========================================================== */
app().addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
 const a=t.dataset.a,i=+t.dataset.i,k=+t.dataset.k,v=+t.dataset.v;
 if(a==='go'){const to=+t.dataset.to;
  if((to===3&&S.step===2)||(to===4&&S.step===3)){const n=errCount();if(n){document.getElementById('err').textContent=n+' erreur(s) à corriger ci-dessous avant de continuer.';return}}
  S.step=to;render();return}
 if(a==='open'){S.open=i;return}
 if(a==='addday'){S.days++;ensure();S.open=S.days-1;render();return}
 if(a==='pOpen'){openPanel(t.dataset.kind,i,t.dataset.k!==undefined?k:null,t.dataset.s);return}
 if(a==='pCancel'){S.panel=null;render();return}
 if(a==='pOk'){applyPanel();return}
 if(a==='pSame'){const P=S.panel,p=S.D[P.i-1].night;P.mode=p.mode;P.zone=p.zone;P.hotel=p.hotel;P.oname=p.own.name;P.oaddr=p.own.addr;render();return}
 if(a==='rmstop'){S.D[i].stops.splice(k,1);if(S.panel&&S.panel.i===i&&S.panel.k===k)S.panel=null;render();return}
 if(a==='nightClear'){S.D[i].night={mode:'none',hotel:'',zone:'',own:{name:'',addr:''},roomType:0,rooms:1,beds:1,twin:false,bf:false};render();return}
 if(a==='delveh'){S.D[i].veh.splice(v,1);render();return}
 if(a==='send'){if(errCount())return;if(!S.nm||(S.w||'').trim().length<3||(S.e||'').trim().length<3){document.getElementById('err').textContent='Renseignez votre nom, votre WhatsApp et votre e-mail.';return}t.disabled=true;t.textContent='Envoi…';try{parent.postMessage({type:'afa-plan',plan:buildPlan(),pax:pax(),contact:{nm:S.nm,nat:S.nat,w:S.w,e:S.e,nt:S.dietNote,pay:S.pay}},'*')}catch(err){}return}
 if(a==='mybk'){try{parent.postMessage({type:'afa-mybk'},'*')}catch(err){}return}
 if(a==='close'){closeBooking();return}
 if(a==='reopen'){S.closed=false;S.done=false;S.step=1;S.panel=null;render();return}
});
app().addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.pt){const P=S.panel;if(!P)return;const f=t.dataset.pt;P[f]=t.value;
  const b=document.querySelector('[data-a=pOk]');if(b)b.disabled=!panelOk(P);return}
 const f=t.dataset.txt;if(!f)return;
 const i=+t.dataset.i,k=+t.dataset.k,v=+t.dataset.v,val=t.value;
 if(f==='dietNote')S.dietNote=val;
 else if(f==='nm')S.nm=val;else if(f==='nat')S.nat=val;else if(f==='w')S.w=val;else if(f==='e')S.e=val;
 else if(f==='vehFrom')S.D[i].veh[v].from=val;
});
app().addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.pf){
  const P=S.panel;if(!P)return;const f=t.dataset.pf;
  switch(f){
   case 'zone':P.zone=t.value;
    if(P.kind==='stop'&&!CIRC.some(c=>c.id===P.ref&&c.z===P.zone))P.ref='';
    if(P.kind==='meal'){const l=partnersIn(RES,P.zone);if(P.mode==='partner'&&!l.some(r=>r.id===P.ref)){P.ref='';if(!l.length)P.mode='afa'}}
    if(P.kind==='night'){if(!(hOf(P.hotel)&&hOf(P.hotel).z===P.zone))P.hotel='';if(P.mode==='partner'&&!partnersIn(HOT,P.zone).length)P.mode='afa'}
    break;
   case 'ref':P.ref=t.value;break;
   case 'dh':P.dh=t.value;break;
   case 'time':P.time=t.value||P.time;break;
   case 'mode':P.mode=t.value;if(P.kind==='meal'&&P.mode!=='partner')P.ref='';break;
   case 'hotel':P.hotel=t.value;break;
   case 'roomType':P.roomType=+t.value;break;
   case 'rooms':P.rooms=Math.max(1,+t.value||1);break;
   case 'beds':P.beds=Math.max(1,+t.value||1);break;
   case 'twin':P.twin=t.checked;break;
   case 'bf':P.bf=t.checked;break;
   case 'v':P.v=t.value;break;
   case 'days':P.days=Math.max(1,+t.value||1);break;
  }
  render();return}
 const f=t.dataset.f,kk=t.dataset.k;
 if(t.dataset.txt||t.dataset.pt||(!f&&!kk))return;
 const i=+t.dataset.i,k=+t.dataset.k;
 if(t.type==='checkbox'&&kk==='diet'){const x=t.value;S.diet=t.checked?S.diet.concat([x]):S.diet.filter(y=>y!==x);render();return}
 if(f==='pay'){S.pay=t.value;return}
 const D=S.D[i];
 switch(f){
  case 'start':S.start=t.value;break;
  case 'startZone':S.startZone=t.value;break;
  case 'days':S.days=Math.max(1,Math.min(30,+t.value||1));break;
  case 'adults':S.adults=Math.max(1,+t.value||1);break;
  case 'kids':S.kids=Math.max(0,+t.value||0);break;
  case 't0':D.t0=t.value||'08:00';break;
 }
 render();
});

function buildPlan(){
 const{tot,devis}=calc(),days=[];
 let txt='*SÉJOUR SUR MESURE — '+S.days+' jour'+(S.days>1?'s':'')+'*'+(S.start?' (arrivée le '+fdt(S.start)+')':'')+'\n_Nombre de personnes : '+S.adults+' adulte(s)'+(S.kids?', '+S.kids+' enfant(s)':'')+([...S.diet,S.dietNote].filter(Boolean).length?' · Régime : '+[...S.diet,S.dietNote].filter(Boolean).join(', '):'')+'_\n\n';
 for(let i=0;i<S.days;i++){
  const rows=dayRows(i);
  days.push({i:i+1,date:dateOf(i),rows:rows.map(r=>r.text)});
  txt+='*Jour '+(i+1)+(S.start?' ('+dateOf(i)+')':'')+'*\n'+rows.map(r=>'• '+r.text).join('\n')+'\n\n';
 }
 txt+=tot?'*Estimation : '+money3(tot)+'*'+(devis?' _(hors '+devis+' élément(s) à confirmer)_':''):'*Prix à établir sur devis*';
 return{days:days,total:tot,est:tot,quote:!tot||devis>0,text:txt};
}
window.addEventListener('message',e=>{
 const m=e.data;if(m&&m.type==='afa-cur'){CURSEL=m.cur||'XOF';render();return}if(m&&m.type==='afa-done'){S.done=true;S.ref=m.ref||S.ref;S.okSent=m.ok!==false;S.waUrl=m.wa||'';render();return}if(!m||m.type!=='afa-data')return;
 if(m.cur)CURSEL=m.cur;ZONES=m.zones||[];CIRC=m.circuits||[];HOT=m.hotels||[];RES=m.restos||[];VEH=m.veh||[];
 if(Array.isArray(m.saved))addSaved(m.saved.filter(id=>CIRC.some(c=>c.id===id)));
 if(!ZONES.includes(S.startZone))S.startZone=ZONES[0]||'';
 READY=true;render();
});
S.D=[newDay()];ensure();render();
</script>
