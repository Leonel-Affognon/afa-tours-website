name: AFA website browser checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - { name: desktop, width: 1440, height: 900 }
          - { name: tablet, width: 768, height: 1024 }
          - { name: mobile, width: 390, height: 844 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/afa-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/afa-http.log
          exit 1
      - name: Check pull request checkout on ${{ matrix.viewport.name }}
        env:
          SITE_URL: http://127.0.0.1:4173/
          VIEWPORT_WIDTH: ${{ matrix.viewport.width }}
          VIEWPORT_HEIGHT: ${{ matrix.viewport.height }}
          VIEWPORT_NAME: ${{ matrix.viewport.name }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: Number(process.env.VIEWPORT_WIDTH), height: Number(process.env.VIEWPORT_HEIGHT) },
              isMobile: process.env.VIEWPORT_NAME === 'mobile',
              hasTouch: process.env.VIEWPORT_NAME !== 'desktop'
            });
            const page = await context.newPage();
            const errors = [];
            let currentPath = '/';
            page.on('pageerror', error => errors.push(currentPath + ': ' + (error.stack || error.message)));
            page.on('console', message => { if (message.type() === 'error') errors.push(currentPath + ': ' + message.text() + ' @ ' + JSON.stringify(message.location())); });
            const pages = ['', 'circuits.html', 'destinations.html', 'experiences.html', 'agenda.html', 'admin.html', 'about.html', 'gallery.html', 'contact.html'];
            for (const path of pages) {
              currentPath = path || '/';
              const response = await page.goto(new URL(path, process.env.SITE_URL).href, { waitUntil: 'networkidle', timeout: 60000 });
              if (!response || !response.ok()) throw new Error(path + ': HTTP ' + (response && response.status()));
              await page.waitForTimeout(700);
              if (path === 'gallery.html' || path === 'experiences.html') {
                await page.locator('#afa-media-gallery').scrollIntoViewIfNeeded();
                await page.waitForFunction(() => document.querySelectorAll('#afa-media-gallery .afa-photo-cell').length > 0, null, { timeout: 15000 });
        await page.waitForFunction(() => [...document.querySelectorAll('#afa-media-gallery .afa-photo-cell img')].some(img => img.complete && img.naturalWidth > 0), null, { timeout: 20000 });
        const mediaState = await page.evaluate(() => {
          const cells = [...document.querySelectorAll('#afa-media-gallery .afa-photo-cell')];
          const images = [...document.querySelectorAll('#afa-media-gallery .afa-photo-cell img')];
          return { photos: cells.length, images: images.length,
            loadedImages: images.filter(img => img.complete && img.naturalWidth > 0).length,
            viewTabs: document.querySelectorAll('#afa-media-gallery [data-view]').length };
        });
        if (!mediaState.photos) throw new Error(path + ': no photo/video thumbnails rendered: ' + JSON.stringify(mediaState));
        if (!mediaState.loadedImages) throw new Error(path + ': no photo thumbnail loaded: ' + JSON.stringify(mediaState));
        if (mediaState.viewTabs !== 2) throw new Error(path + ': Photothèque/Collections tabs missing: ' + JSON.stringify(mediaState));
        await page.locator('#afa-media-gallery .afa-photo-cell').first().click();
        await page.locator('.afa-lightbox.is-open').waitFor({ state: 'visible', timeout: 5000 });
        if (await page.locator('.afa-lightbox-media').count() !== 1) throw new Error(path + ': lightbox media missing');
        await page.waitForFunction(() => {
          const el = document.querySelector('.afa-lightbox-media');
          return !!el && (el.tagName !== 'IMG' || (el.complete && el.naturalWidth > 0));
        }, null, { timeout: 15000 });
        await page.locator('.afa-lightbox [data-close]').click();
                console.log('PASS media gallery', path, JSON.stringify(mediaState));
              }
              const state = await page.evaluate(() => ({
                title: document.title,
                bodyReady: document.body.classList.contains('page-ready'),
                motionReady: document.body.classList.contains('afa-motion-ready'),
                motionCss: !!document.querySelector('link[data-afa-motion-plus]'),
                mobileNav: !!document.querySelector('.mobile-quick-nav'),
                width: document.documentElement.scrollWidth,
                viewport: window.innerWidth
              }));
              if (!state.title) throw new Error(path + ': missing document title');
              if (path !== 'admin.html' && (!state.bodyReady || !state.motionReady || !state.motionCss)) throw new Error(path + ': motion layer did not initialize: ' + JSON.stringify(state));
              if (state.width > state.viewport + 2) throw new Error(path + ': horizontal overflow ' + JSON.stringify(state));
              if (path !== 'admin.html' && process.env.VIEWPORT_NAME === 'mobile' && !state.mobileNav) throw new Error(path + ': mobile quick navigation missing');
              await page.screenshot({ path: 'screenshot-' + (path || 'home').replaceAll('/', '-') + process.env.VIEWPORT_NAME + '.png', fullPage: true });
              console.log('PASS', process.env.VIEWPORT_NAME, path || '/', JSON.stringify(state));
            }
            if (errors.length) throw new Error('Browser console/page errors: ' + errors.join(' | '));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afa-${{ matrix.viewport.name }}-screenshots
          path: screenshot-*.png
          if-no-files-found: ignore
