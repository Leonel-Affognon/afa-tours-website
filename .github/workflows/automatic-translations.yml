name: Automatic catalogue translations
on:
  push:
    branches:
      - work/multilingual-safety-2026-11-03
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to Supabase"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: afa-catalogue-translations
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: translation-worker/requirements.txt
      - name: Install dependencies
        run: pip install -r translation-worker/requirements.txt
      - name: Verify Python worker syntax
        run: python -m py_compile translation-worker/worker.py
      - name: Run translation safety tests
        run: python -m unittest discover -s translation-worker/tests -v
      - name: Verify modified JavaScript syntax
        shell: bash
        run: |
          for file in language.js app.js agenda.js site-locales.js tour-catalog-render.js gallery-catalog.js destination-catalog.js experiences-catalog.js circuits-catalog.js admin.js admin-content.js; do
            node --input-type=module --check < "$file"
          done
      - name: Run translation worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false') }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not configured; safely skipping database access."
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" != "main" ] && [ "$DRY_RUN" = "false" ]; then
            echo "Write mode is disabled outside main; no database changes were made."
            exit 1
          fi
          python translation-worker/worker.py
